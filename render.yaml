services:
  - type: web
    name: yeoro-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: TOURISM_API_KEY
        sync: false
      - key: KAKAO_MAP_REST_API_KEY
        sync: false
      - key: WEATHER_API_KEY
        sync: false
      - key: KAKAO_REST_API_KEY
        sync: false
      - key: KAKAO_CLIENT_SECRET
        sync: false
      - key: KAKAO_REDIRECT_URI
        sync: false
      - key: CORS_EXTRA_ORIGINS
        sync: false
